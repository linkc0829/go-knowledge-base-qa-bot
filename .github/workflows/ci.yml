name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to the same PR makes the running checks moot.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Latest patch of the go.mod minor, so govulncheck judges a patched stdlib.
  GO_VERSION: "1.25.x"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: gofmt
        run: |
          unformatted=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "$unformatted" ]; then echo "Run gofmt on:"; echo "$unformatted"; exit 1; fi
      - name: go mod tidy
        run: go mod tidy && git diff --exit-code go.mod go.sum
      - name: go vet
        run: go vet ./...
      # depguard in here enforces the hexagonal layer rules (CLAUDE.md R1).
      - uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64.8
          # The prebuilt v1.64.8 binary predates Go 1.25 and refuses a 1.25 module.
          install-mode: goinstall

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: go build ./...
      - run: go test -race -short -count=1 ./...

  # A2: admission, cancellation, timeout and restart behaviour of the real
  # gateway binary against a mock upstream. No GPU or API key needed.
  gwload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: go run ./cmd/gwload -out metrics/gateway-a2.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gateway-a2-report
          path: metrics/gateway-a2.json
          if-no-files-found: ignore

  # Guards run_eval.py scoring and its /health gate; stdlib only.
  eval-selfcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python .claude/skills/ui-kb-validate/templates/selfcheck_fixes.py
      - run: python .claude/skills/ui-kb-validate/templates/selfcheck_health.py
      - run: python .claude/skills/ui-kb-validate/templates/run_eval.py --selftest

  # The deploy image: proves the Dockerfile builds and the binaries it ships
  # run on distroless (static, no libc).
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t llm-platform:ci .
      # Nothing listens on :1, so the probe must run and report unhealthy (exit 1);
      # any other code means the binary did not start.
      - run: |
          set +e
          docker run --rm --entrypoint /app/healthcheck llm-platform:ci http://127.0.0.1:1/
          test $? -eq 1

  # Runs the pinned Alloy and Loki images from deploy/observability/compose.yaml:
  # the log allowlist must drop question text and names, and every dashboard
  # query must parse.
  observability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python deploy/observability/alloy/test/run.py
      - run: python deploy/observability/grafana/test/check_queries.py

  # Host setup and deployment playbooks: syntax and lint only. A real run
  # needs the AI Station (deploy/README.md acceptance checklist).
  ansible:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy/ansible
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ansible-core ansible-lint
      - run: |
          for p in site.yml backup.yml restore.yml; do
            ansible-playbook -i inventory.example.yml --syntax-check \
              -e vault_file=vault.example.yml -e backup_file=x "$p"
          done
      - run: ansible-lint --offline
      # The runner is disposable and has Docker: apply the real firewall role
      # twice (idempotence) and let its DOCKER-USER check run.
      - name: firewall role against the runner
        run: |
          for i in 1 2; do
            sudo "$(command -v ansible-playbook)" -i localhost, -c local tests/firewall.yml
          done

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      # Fails only on vulnerabilities the code actually reaches.
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

---
# vault.example.yml lists every key. A PR that adds one there fails here until
# the maintainer's vault.yml has it, instead of deploying it blank.
- name: Check every vault key is set
  vars:
    stack_vault_missing: >-
      {{ (lookup('file', role_path ~ '/../../vault.example.yml') | from_yaml).keys()
         | difference(query('varnames', '^vault_')) }}
  ansible.builtin.assert:
    that: stack_vault_missing | length == 0
    fail_msg: >-
      Not set: {{ stack_vault_missing | join(', ') }}. Add them to vault.yml
      (see vault.example.yml).
    quiet: true

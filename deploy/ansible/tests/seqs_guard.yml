---
# CI only: the stack role's guard against a partial deploy that changes
# inference_max_seqs, which sets both vLLM and the gateway cap. It reads the
# running containers, so the runner's Docker stands in for them.
#   sudo ansible-playbook -i localhost, -c local tests/seqs_guard.yml
- name: Shared concurrency guard
  hosts: all
  become: true
  gather_facts: false
  vars:
    guard: "{{ playbook_dir }}/../roles/stack/tasks/seqs_guard.yml"
    inference_max_seqs: 4
    inference_model: gemma
    vault_vllm_api_key: test-key
    vllm_labels: >-
      --label com.docker.compose.project=inference
      --label com.docker.compose.service=vllm
    gateway_labels: >-
      --label com.docker.compose.project=platform
      --label com.docker.compose.service=gateway
  tasks:
    - name: Nothing running (value unknown) stops the play
      block:
        - name: Run the guard
          ansible.builtin.include_tasks: "{{ guard }}"
        - name: Record that it passed
          ansible.builtin.set_fact:
            seqs_guard_stopped_unknown: false
      rescue:
        - name: Record that it stopped
          ansible.builtin.set_fact:
            seqs_guard_stopped_unknown: true

    - name: Check, then try matching and changed values
      block:
        # sh ignores the trailing words; they only sit in Config.Cmd like
        # vLLM's own flags do.
        - name: Start a stand-in vLLM with --max-num-seqs 4
          ansible.builtin.command: >-
            docker run -d --name seqs-vllm {{ vllm_labels }}
            busybox sh -c 'sleep 300' -- --max-num-seqs 4
          changed_when: true
        - name: Start a stand-in gateway with GATEWAY_MAX_INFLIGHT=4
          ansible.builtin.command: >-
            docker run -d --name seqs-gateway {{ gateway_labels }}
            -e GATEWAY_MAX_INFLIGHT=4 busybox sleep 300
          changed_when: true

        - name: Matching values pass
          ansible.builtin.include_tasks: "{{ guard }}"

        - name: A changed value stops the play
          block:
            - name: Run the guard with inference_max_seqs 8
              ansible.builtin.include_tasks: "{{ guard }}"
              vars:
                inference_max_seqs: 8
            - name: Record that it passed
              ansible.builtin.set_fact:
                seqs_guard_stopped_changed: false
          rescue:
            - name: Record that it stopped
              ansible.builtin.set_fact:
                seqs_guard_stopped_changed: true
        # EXPERIMENT (exp/k2-ansible): K2 has no --max-num-seqs; the guard
        # reads total_slots from llama-server's /props instead.
        - name: Start a stand-in K2 whose /props reports 4 slots
          ansible.builtin.command: >-
            docker run -d --name seqs-k2 -p 127.0.0.1:8000:8000 busybox
            sh -c 'mkdir -p /www && echo "{\"total_slots\":4}" > /www/props
            && httpd -f -p 8000 -h /www'
          changed_when: true
        - name: Wait for it
          ansible.builtin.wait_for:
            host: 127.0.0.1
            port: 8000
            timeout: 30

        - name: K2 with matching slots passes
          ansible.builtin.include_tasks: "{{ guard }}"
          vars:
            inference_model: k2

        - name: K2 with a changed value stops the play
          block:
            - name: Run the guard for K2 with inference_max_seqs 8
              ansible.builtin.include_tasks: "{{ guard }}"
              vars:
                inference_model: k2
                inference_max_seqs: 8
            - name: Record that it passed
              ansible.builtin.set_fact:
                seqs_guard_stopped_k2: false
          rescue:
            - name: Record that it stopped
              ansible.builtin.set_fact:
                seqs_guard_stopped_k2: true
      always:
        - name: Remove the stand-ins
          ansible.builtin.command: docker rm -f seqs-vllm seqs-gateway seqs-k2
          changed_when: true
          failed_when: false

    - name: Check the guard stopped both unsafe cases
      ansible.builtin.assert:
        that:
          - seqs_guard_stopped_unknown
          - seqs_guard_stopped_changed
          - seqs_guard_stopped_k2
        fail_msg: the guard let a partial deploy through without a confirmed match

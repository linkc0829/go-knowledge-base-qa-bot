---
# CI only: the stack role's check that every vault.example.yml key is set.
# The second play loads an empty vault (/dev/null).
#   ansible-playbook -i localhost, -c local tests/vault_guard.yml
- name: Every key set passes
  hosts: all
  become: false
  gather_facts: false
  vars_files:
    - ../vault.example.yml
  tasks:
    - name: Run the guard
      ansible.builtin.include_role:
        name: stack
        tasks_from: vault_guard

- name: A missing key stops the play
  hosts: all
  become: false
  gather_facts: false
  vars_files:
    - /dev/null
  vars:
    vault_vllm_api_key: x   # set one, so the rest are reported missing
  tasks:
    - name: Run the guard with no vault
      block:
        - name: Run the guard
          ansible.builtin.include_role:
            name: stack
            tasks_from: vault_guard
        - name: Record that it passed
          ansible.builtin.set_fact:
            vault_guard_stopped: false
      rescue:
        - name: Record that it stopped
          ansible.builtin.set_fact:
            vault_guard_stopped: true

    - name: Check the guard stopped
      ansible.builtin.assert:
        that: vault_guard_stopped
        fail_msg: the guard let a deploy through with vault keys missing

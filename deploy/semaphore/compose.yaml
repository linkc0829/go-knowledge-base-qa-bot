# Semaphore UI: the PM's deploy button (README "Semaphore UI"). Runs on a LAN
# machine other than the AI Station, so --tags host can never restart it.
#   cp .env.example .env && chmod 600 .env   # fill it
#   ssh-keyscan 192.168.22.101 > known_hosts # then check the fingerprint
#   docker compose up -d
name: semaphore

services:
  semaphore:
    image: semaphoreui/semaphore:v2.19.14
    restart: unless-stopped
    ports: ["3000:3000"]
    environment:
      SEMAPHORE_DB_DIALECT: sqlite
      SEMAPHORE_ADMIN: admin
      SEMAPHORE_ADMIN_NAME: admin
      SEMAPHORE_ADMIN_EMAIL: admin@localhost
      SEMAPHORE_ADMIN_PASSWORD: ${SEMAPHORE_ADMIN_PASSWORD:?set it in .env}
      # Encrypts the Key Store and secrets in the database. Losing it loses them.
      SEMAPHORE_ACCESS_KEY_ENCRYPTION: ${SEMAPHORE_ACCESS_KEY_ENCRYPTION:?set it in .env}
    volumes:
      - ${DATA_DIR:-/srv/semaphore}/db:/var/lib/semaphore
      - ${DATA_DIR:-/srv/semaphore}/config:/etc/semaphore
      # Pinned host key: the play sends the sudo password over this SSH link,
      # so host key checking stays on.
      - ./known_hosts:/etc/ssh/ssh_known_hosts:ro
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
